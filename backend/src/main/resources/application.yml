server:
  port: 8083

session:
  # 本地開發用 Lax，生產環境（跨域）設 None
  cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shoppingcart}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: always

logging:
  level:
    com.shoppingcart: DEBUG
