<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#eef0f2"/>

  <!-- 房子外框（開底，無地板線） -->
  <polyline
    points="14,85 14,42 50,10 86,42 86,85"
    fill="none"
    stroke="#1e2330"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 沙發背面 + 扶手（頂部圓角） -->
  <path
    d="M 22,77 L 22,56 Q 22,53 25,53 L 75,53 Q 78,53 78,56 L 78,77"
    fill="none"
    stroke="#1e2330"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 左扶手內邊 -->
  <line x1="35" y1="53" x2="35" y2="68" stroke="#1e2330" stroke-width="5" stroke-linecap="round"/>

  <!-- 右扶手內邊 -->
  <line x1="65" y1="53" x2="65" y2="68" stroke="#1e2330" stroke-width="5" stroke-linecap="round"/>

  <!-- 座墊橫線 -->
  <line x1="22" y1="68" x2="78" y2="68" stroke="#1e2330" stroke-width="5" stroke-linecap="round"/>

  <!-- 椅腳 -->
  <line x1="32" y1="77" x2="32" y2="84" stroke="#1e2330" stroke-width="5" stroke-linecap="round"/>
  <line x1="68" y1="77" x2="68" y2="84" stroke="#1e2330" stroke-width="5" stroke-linecap="round"/>
</svg>
